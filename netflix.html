<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Netflix Clone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      background-color: #141414;
      font-family: Arial, sans-serif;
      color: white;
    }

    header {
      background-color: #111;
      padding: 20px;
      text-align: left;
    }

    .logo {
      color: #e50914;
      font-size: 28px;
      font-weight: bold;
    }

    .movie-row {
      padding: 20px;
    }

    .movies-container {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      padding-top: 10px;
    }

    .movie {
      width: 180px;
      height: 270px;
      object-fit: cover;
      cursor: pointer;
      border-radius: 5px;
      transition: transform 0.3s;
    }

    .movie:hover {
      transform: scale(1.1);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #222;
      padding: 30px;
      border-radius: 10px;
      max-width: 500px;
      text-align: center;
      color: white;
    }

    #closeBtn {
      float: right;
      cursor: pointer;
      font-size: 24px;
    }

    #playBtn {
      background-color: #e50914;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 18px;
      margin-top: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1 class="logo">NETFLIX</h1>
  </header>

  <main>
    <section class="movie-row">
      <h2>Popular Movies</h2>
      <div class="movies-container" id="movieList">
        <!-- JS inserts movie cards here -->
      </div>
    </section>
  </main>

  <!-- Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span id="closeBtn">&times;</span>
      <h2 id="movieTitle"></h2>
      <p id="movieDescription"></p>
      <button id="playBtn">▶ Play</button>
    </div>
  </div>

  <script>
    const movies = [
      {
        title: "Stranger Things",
        description: "A thrilling mystery with supernatural twists.",
        image: "https://m.media-amazon.com/images/I/71yDbpB+5UL._AC_UF894,1000_QL80_.jpg"
      },
      {
        title: "Money Heist",
        description: "A mastermind leads the biggest heist in history.",
        image: "https://m.media-amazon.com/images/I/81AYzU9AqZL._AC_UF894,1000_QL80_.jpg"
      },
      {
        title: "The Witcher",
        description: "A mutated monster hunter struggles to find his place.",
        image: "https://m.media-amazon.com/images/I/81Q8UC5LdxL._AC_UF894,1000_QL80_.jpg"
      },
      {
        title: "Wednesday",
        description: "Wednesday Addams starts at Nevermore Academy.",
        image: "https://m.media-amazon.com/images/I/71hqyH7QJRL._AC_UF894,1000_QL80_.jpg"
      }
    ];

    const movieList = document.getElementById("movieList");
    const modal = document.getElementById("modal");
    const movieTitle = document.getElementById("movieTitle");
    const movieDescription = document.getElementById("movieDescription");
    const closeBtn = document.getElementById("closeBtn");

    movies.forEach(movie => {
      const img = document.createElement("img");
      img.src = movie.image;
      img.classList.add("movie");
      img.alt = movie.title;
      img.addEventListener("click", () => {
        movieTitle.textContent = movie.title;
        movieDescription.textContent = movie.description;
        modal.style.display = "flex";
      });
      movieList.appendChild(img);
    });

    closeBtn.onclick = () => modal.style.display = "none";
    window.onclick = e => {
      if (e.target === modal) modal.style.display = "none";
    };
  </script>
</body>
</html>
